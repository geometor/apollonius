  <g id="labels">
    <text x="195.00" y="22.00" text-anchor="middle" class="geom-label-sm">IV.25: At Most 4 Intersections</text>
    <text x="120.38" y="116.38" text-anchor="middle" class="geom-label-assert">P₁</text>
    <text x="269.62" y="116.38" text-anchor="middle" class="geom-label-assert">P₂</text>
    <text x="269.62" y="255.62" text-anchor="middle" class="geom-label-assert">P₃</text>
    <text x="120.38" y="255.62" text-anchor="middle" class="geom-label-assert">P₄</text>
    <text x="195.00" y="344.00" text-anchor="middle" class="geom-label-sm">C₁ ∩ C₂ = {P₁, P₂, P₃, P₄}  (|C₁ ∩ C₂| ≤ 4)</text>
    <text x="556.00" y="22.00" text-anchor="middle" class="geom-label-sm">IV.42–46: Double Tangency Exhausts All 4</text>
    <text x="412.00" y="80.00" text-anchor="middle" class="geom-label-rose">T₁ (mult. 2)</text>
    <text x="700.00" y="80.00" text-anchor="middle" class="geom-label-rose">T₂ (mult. 2)</text>
    <text x="556.00" y="344.00" text-anchor="middle" class="geom-label-sm">Bitangent Conics: 2 + 2 = 4 ⇒ Zero Further Common Points</text>
  </g>
