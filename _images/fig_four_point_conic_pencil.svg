    .geom-polygon-accent {
      fill: var(--geom-accent);
      fill-opacity: 0.16;
      stroke: var(--geom-accent);
      stroke-width: 1.4;
    }
    .geom-polygon-assert {
      fill: var(--geom-assert);
      fill-opacity: 0.14;
      stroke: var(--geom-assert);
      stroke-width: 1.4;
    }
    .geom-polygon-hyper {
      fill: var(--geom-hyper);
      fill-opacity: 0.14;
      stroke: var(--geom-hyper);
      stroke-width: 1.4;
    }
    .geom-polygon-rose {
      fill: var(--geom-rose);
      fill-opacity: 0.14;
      stroke: var(--geom-rose);
      stroke-width: 1.4;
    }
    .geom-point {
      fill: var(--geom-fg);
