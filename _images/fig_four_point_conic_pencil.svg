      stroke-width: 1.75;
      fill: none;
    }
    .geom-overlay {
      stroke: transparent;
      stroke-width: 4.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.06;
      stroke: none;
