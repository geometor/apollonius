    <ellipse cx="556.00" cy="182.00" rx="138.00" ry="54.00" fill="none" class="geom-accent-line" />
    <path d="M 418.00 88.00 L 418.00 182.00 L 418.00 276.00" fill="none" class="geom-rose-line" data-ref="[ T1 ]" />
    <path d="M 694.00 88.00 L 694.00 182.00 L 694.00 276.00" fill="none" class="geom-rose-line" data-ref="[ T2 ]" />
