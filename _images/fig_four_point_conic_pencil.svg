    }
    .geom-point-accent {
      fill: var(--geom-accent);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
    }
    .geom-point-assert {
      fill: var(--geom-assert);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
    }
    .geom-point-hyper {
      fill: var(--geom-hyper);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
    }
    .geom-point-rose {
      fill: var(--geom-rose);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
    }
    .geom-label {
      font-size: 13.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-size: 11.5px;
      font-weight: 700;
      fill: var(--geom-muted);
      user-select: none;
    }
    .geom-label-accent {
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-accent);
      user-select: none;
    }
    .geom-label-assert {
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-assert);
      user-select: none;
    }
    .geom-label-hyper {
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-hyper);
      user-select: none;
    }
    .geom-label-rose {
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-rose);
      user-select: none;
    }
  </style>
