    <text x="340.00" y="24.00" text-anchor="middle" class="geom-label-sm">I.34–37: Harmonic Tangent Construction  (A′, A ; V, T) = −1  &amp;  CV · CT = CA²</text>
    <text x="213.50" y="298.00" text-anchor="middle" class="geom-label-sm">A′V = 3a/2</text>
