  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-muted: #71717a;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #18181b;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
      --geom-hyper: #2563eb;
      --geom-rose: #be123c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #e4ded5;
        --geom-bg: #18181b;
        --geom-muted: #a1a1aa;
        --geom-point-stroke: #18181b;
        --geom-poly-fill: #e4ded5;
        --geom-accent: #eab308;
        --geom-assert: #4ade80;
        --geom-hyper: #60a5fa;
        --geom-rose: #fb7185;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', system-ui, sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
