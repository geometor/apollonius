      stroke: var(--geom-muted);
      stroke-width: 1.15;
      stroke-opacity: 0.72;
      stroke-linecap: round;
      fill: none;
    }
    .geom-dashed {
      stroke: var(--geom-muted);
      stroke-width: 1.35;
      stroke-dasharray: 5, 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-accent-line {
      stroke: var(--geom-accent);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-assert-line {
      stroke: var(--geom-assert);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-hyper-line {
      stroke: var(--geom-hyper);
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-rose-line {
      stroke: var(--geom-rose);
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-circle {
      stroke: var(--geom-fg);
      stroke-width: 1.75;
      fill: none;
    }
    .geom-overlay {
      stroke: transparent;
      stroke-width: 4.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.06;
      stroke: none;
    }
    .geom-polygon-accent {
      fill: var(--geom-accent);
      fill-opacity: 0.16;
      stroke: var(--geom-accent);
      stroke-width: 1.4;
    }
    .geom-polygon-assert {
      fill: var(--geom-assert);
      fill-opacity: 0.14;
      stroke: var(--geom-assert);
      stroke-width: 1.4;
    }
    .geom-polygon-hyper {
      fill: var(--geom-hyper);
      fill-opacity: 0.14;
      stroke: var(--geom-hyper);
      stroke-width: 1.4;
    }
    .geom-polygon-rose {
      fill: var(--geom-rose);
      fill-opacity: 0.14;
      stroke: var(--geom-rose);
      stroke-width: 1.4;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
    }
    .geom-point-accent {
      fill: var(--geom-accent);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
    }
    .geom-point-assert {
      fill: var(--geom-assert);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
    }
    .geom-point-hyper {
      fill: var(--geom-hyper);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
    }
    .geom-point-rose {
      fill: var(--geom-rose);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
    }
    .geom-label {
      font-size: 13.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-size: 11.5px;
      font-weight: 700;
      fill: var(--geom-muted);
      user-select: none;
    }
    .geom-label-accent {
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-accent);
      user-select: none;
    }
    .geom-label-assert {
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-assert);
      user-select: none;
    }
    .geom-label-hyper {
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-hyper);
      user-select: none;
    }
    .geom-label-rose {
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-rose);
      user-select: none;
    }
  </style>
