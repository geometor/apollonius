<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330" class="euclid-graphic" data-graphic-id="g8" data-proposition="IV.25-57">
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" orient="auto" markerUnits="userSpaceOnUse">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="var(--geom-assert)" stroke-width="1.8" stroke-linecap="round" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" orient="auto" markerUnits="userSpaceOnUse">
      <line x1="-2" y1="-4.5" x2="-2" y2="4.5" stroke="var(--geom-assert)" stroke-width="1.8" stroke-linecap="round" />
      <line x1="2" y1="-4.5" x2="2" y2="4.5" stroke="var(--geom-assert)" stroke-width="1.8" stroke-linecap="round" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" orient="auto" markerUnits="userSpaceOnUse">
      <line x1="-3.2" y1="-4.5" x2="-3.2" y2="4.5" stroke="var(--geom-assert)" stroke-width="1.8" stroke-linecap="round" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="var(--geom-assert)" stroke-width="1.8" stroke-linecap="round" />
      <line x1="3.2" y1="-4.5" x2="3.2" y2="4.5" stroke="var(--geom-assert)" stroke-width="1.8" stroke-linecap="round" />
    </marker>
  </defs>
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-muted: #71717a;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #18181b;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
      --geom-hyper: #2563eb;
      --geom-rose: #be123c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #e4ded5;
        --geom-bg: #18181b;
        --geom-muted: #a1a1aa;
        --geom-point-stroke: #18181b;
        --geom-poly-fill: #e4ded5;
        --geom-accent: #eab308;
        --geom-assert: #4ade80;
        --geom-hyper: #60a5fa;
        --geom-rose: #fb7185;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', system-ui, sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-faint {
      stroke: var(--geom-muted);
      stroke-width: 1.15;
      stroke-opacity: 0.72;
      stroke-linecap: round;
      fill: none;
    }
    .geom-dashed {
      stroke: var(--geom-muted);
      stroke-width: 1.35;
      stroke-dasharray: 5, 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-accent-line {
      stroke: var(--geom-accent);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-assert-line {
      stroke: var(--geom-assert);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-hyper-line {
      stroke: var(--geom-hyper);
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-rose-line {
      stroke: var(--geom-rose);
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-circle {
      stroke: var(--geom-fg);
      stroke-width: 1.75;
      fill: none;
    }
    .geom-overlay {
      stroke: transparent;
      stroke-width: 4.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.06;
      stroke: none;
    }
    .geom-polygon-accent {
      fill: var(--geom-accent);
      fill-opacity: 0.16;
      stroke: var(--geom-accent);
      stroke-width: 1.4;
    }
    .geom-polygon-assert {
      fill: var(--geom-assert);
      fill-opacity: 0.14;
      stroke: var(--geom-assert);
      stroke-width: 1.4;
    }
    .geom-polygon-rose {
      fill: var(--geom-rose);
      fill-opacity: 0.14;
      stroke: var(--geom-rose);
      stroke-width: 1.4;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
    }
    .geom-point-accent {
      fill: var(--geom-accent);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
    }
    .geom-point-assert {
      fill: var(--geom-assert);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
    }
    .geom-point-rose {
      fill: var(--geom-rose);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
    }
    .geom-label {
      font-size: 13.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-size: 11.5px;
      font-weight: 700;
      fill: var(--geom-muted);
      user-select: none;
    }
    .geom-label-accent {
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-accent);
      user-select: none;
    }
    .geom-label-assert {
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-assert);
      user-select: none;
    }
    .geom-label-hyper {
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-hyper);
      user-select: none;
    }
    .geom-label-rose {
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--geom-rose);
      user-select: none;
    }
  </style>
  <g id="elements">
    <polygon points="130.00,113.00 260.00,113.00 260.00,243.00 130.00,243.00" class="geom-polygon-assert" />
  </g>
  <g id="graphics">
    <ellipse cx="195.00" cy="178.00" rx="136.00" ry="74.00" class="geom-bold" />
    <ellipse cx="195.00" cy="178.00" rx="74.00" ry="136.00" class="geom-hyper-line" />
    <path d="M 130.00 113.00 L 195.00 178.00 L 260.00 243.00" class="geom-dashed" />
    <path d="M 260.00 113.00 L 195.00 178.00 L 130.00 243.00" class="geom-dashed" />
    <path d="M 372.00 20.00 L 372.00 168.00 L 372.00 316.00" class="geom-faint" />
    <ellipse cx="556.00" cy="178.00" rx="142.00" ry="88.00" class="geom-bold" />
    <ellipse cx="556.00" cy="178.00" rx="142.00" ry="56.00" class="geom-accent-line" />
    <path d="M 414.00 80.00 L 414.00 178.00 L 414.00 276.00" class="geom-rose-line" data-ref="[ T1 ]" />
    <path d="M 698.00 80.00 L 698.00 178.00 L 698.00 276.00" class="geom-rose-line" data-ref="[ T2 ]" />
    <path d="M 414.00 178.00 L 556.00 178.00 L 698.00 178.00" class="geom-dashed" data-ref="/ T1 T2 /" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <path d="M 414.00 80.00 L 414.00 178.00 L 414.00 276.00" class="geom-overlay" data-ref="[ T1 ]" />
    <path d="M 698.00 80.00 L 698.00 178.00 L 698.00 276.00" class="geom-overlay" data-ref="[ T2 ]" />
    <path d="M 414.00 178.00 L 556.00 178.00 L 698.00 178.00" class="geom-overlay" data-ref="/ T1 T2 /" />
  </g>
  <g id="points">
    <circle cx="130.00" cy="113.00" r="3.40" class="geom-point-assert" data-ref="P1" />
    <circle cx="260.00" cy="113.00" r="3.40" class="geom-point-assert" data-ref="P2" />
    <circle cx="260.00" cy="243.00" r="3.40" class="geom-point-assert" data-ref="P3" />
    <circle cx="130.00" cy="243.00" r="3.40" class="geom-point-assert" data-ref="P4" />
    <circle cx="414.00" cy="178.00" r="3.40" class="geom-point-rose" data-ref="T1" />
    <circle cx="698.00" cy="178.00" r="3.40" class="geom-point-rose" data-ref="T2" />
  </g>
  <g id="labels">
    <text x="195.00" y="22.00" text-anchor="middle" class="geom-label-sm">IV.25: At Most 4 Intersections</text>
    <text x="115.00" y="107.00" text-anchor="middle" class="geom-label-assert">P₁</text>
    <text x="275.00" y="107.00" text-anchor="middle" class="geom-label-assert">P₂</text>
    <text x="275.00" y="257.00" text-anchor="middle" class="geom-label-assert">P₃</text>
    <text x="115.00" y="257.00" text-anchor="middle" class="geom-label-assert">P₄</text>
    <text x="195.00" y="316.00" text-anchor="middle" class="geom-label-sm">C₁ ∩ C₂ = {P₁, P₂, P₃, P₄}  (|C₁ ∩ C₂| ≤ 4)</text>
    <text x="556.00" y="22.00" text-anchor="middle" class="geom-label-sm">IV.42–46: Double Tangency Exhausts All 4</text>
    <text x="408.00" y="74.00" text-anchor="middle" class="geom-label-rose">T₁ (mult. 2)</text>
    <text x="704.00" y="74.00" text-anchor="middle" class="geom-label-rose">T₂ (mult. 2)</text>
    <text x="556.00" y="316.00" text-anchor="middle" class="geom-label-sm">Bitangent Conics: 2 + 2 = 4 ⇒ Zero Further Common Points</text>
  </g>
</svg>
