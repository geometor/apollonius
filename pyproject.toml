[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometor-apollonius"
authors = [{name = "phi ARCHITECT", email = "phi@geometor.com"}]
description = "Scholarly 3-Track Book Codex and cross-corpus concordance of Apollonius of Perga's Treatise on Conic Sections (Books I–VII, ed. T. L. Heath, 1896)."
readme = "README.rst"
requires-python = ">=3.13"
license = {text = "MIT"}
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
geometor-apollonius = "geometor.apollonius.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.apollonius.__version__"}

[project.urls]
"Website" = "https://geometor.github.io/apollonius"
"Repository" = "https://github.com/geometor/apollonius"
"Issues" = "https://github.com/geometor/apollonius/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
